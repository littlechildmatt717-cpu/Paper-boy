function throwP(){if(state||cd>0)return;cd=.3;const g=new THREE.Group();Cy(g,.08,.4,'#f2f2f2',0,0,0,[0,0,Q]);Cy(g,.085,.08,'#c0392b',0,0,0,[0,0,Q]);sc.add(g);let best=null,bd=99;hs.forEach(h=>{const d=h.position.x-px;if(!h.userData.done&&d>-1&&d<14&&d<bd){bd=d;best=h}});const sd=best?best.userData.side:-1,T=.6,tz=sd<0?-7.3:7.3,tx=(best?best.position.x:px+6)-sp*T;papers.push({g,x:px+.5,y:py+(duck?.7:1.5),z:0,vx:(tx-px)/T,vy:7.8,vz:tz/T})}
function step(dt){
 if(state){overT-=dt;if(overT<=0)reset();return}
 cd-=dt;time+=dt;
 sp+=((K.f?11:K.b?2.5:6.5)-sp)*Math.min(1,4*dt);off+=sp*dt;
 duck=(K.d&&py<=0)?1:0;
 if(K.u&&py<=0&&!duck)vy=13;
 if(py>0||vy>0){vy-=30*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
 hx-=sp*dt;hz-=sp*dt;hs.forEach(h=>h.position.x-=sp*dt);hs=hs.filter(h=>h.position.x>-16||(kill(h),0));if(hx<30)hx=mkHouse(hx,-1);
 if(!obs.length)sT-=dt;
 if(sT<=0&&!obs.length){let o;do{o=OB[Math.random()*OB.length|0]}while(o.n===lastN||o.n==='pipe'||o.n==='lorry');lastN=o.n;const g=new THREE.Group();g.userData={};o.f(g);g.position.set(16+o.w/2,0,0);sc.add(g);obs.push({...o,g,x:g.position.x});sT=.4+Math.random()*.7;oc++;if(oc>=5&&hearts<3&&!picks.length){oc=0;const hx2=16+o.w/2+7,m=heart3();m.position.set(hx2,2.6+Math.random()*.7,0);sc.add(m);picks.push({m,x:hx2,y:m.position.y})}}
 
 const x0=px-.8,x1=px+.8,y0=py,y1=py+(duck?1:1.9);
 obs.forEach(o=>{o.x-=(sp+o.e)*dt;o.g.position.x=o.x;const u=o.g.userData;
  if(u.w)u.w.forEach((w,i)=>w.rotation.x=(i?1:-1)*Math.sin(time*14)*.7);
  if(u.l){const f=((time*6)|0)%2;u.l[0].emissiveIntensity=f?2:0;u.l[1].emissiveIntensity=f?0:2}
  if(inv<=0&&x1>o.x-o.w/2+.15&&x0<o.x+o.w/2-.15&&y1>o.oy+.08&&y0<o.oy+o.h-.08){hearts--;inv=1.6;ui();if(hearts<=0){state=1;overT=2.8;Gg.style.display='flex';document.getElementById('gs').textContent='Delivered: '+delivered}}});
 obs=obs.filter(o=>o.x+o.w/2>-9||(kill(o.g),0));
 if(inv>0)inv-=dt;
 picks.forEach(p=>{p.x-=sp*dt;p.m.position.set(p.x,p.y+Math.sin(time*3)*.15,0);p.m.rotation.y+=2*dt;if(Math.hypot(p.x-px,p.y-(py+.95))<1){p.got=1;if(hearts<3){hearts++;ui()}}});
 picks=picks.filter(p=>!(p.got||p.x<-9)||(kill(p.m),0));
 papers.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=22*dt;p.g.position.set(p.x,p.y,p.z);p.g.rotation.z+=10*dt;
  {for(const h of hs){if((h.userData.side<0?p.z<-7:p.z>7)&&Math.abs(p.x-h.position.x)<h.userData.w/2&&p.y>0&&p.y<h.userData.h){p.dead=1;if(!h.userData.done){h.userData.done=1;h.userData.gl.emissiveIntensity=.9;h.userData.dm.color.set('#2ecc40');delivered++;ui();Nn.style.transform='scale(1.3)';setTimeout(()=>Nn.style.transform='',150)}break}}}
  if(p.y<0||p.z<-12||p.z>12||p.x>60)p.dead=1});
 papers=papers.filter(p=>!p.dead||(kill(p.g),0));
 P.position.set(px,py,0);P.visible=!(inv>0&&((inv*12)|0)%2);
 pa+=sp*dt*(py<=0?.9:.15);pedal(pa);wheels.forEach(w=>w.rotation.z-=sp*dt/.45);
 RG.rotation.z+=((duck?-.6:0)-RG.rotation.z)*Math.min(1,12*dt);
 dashes.forEach((d,i)=>d.position.x=(((i>>1)*4-off)%56+56)%56-14);
 lamps.forEach((l,i)=>l.position.x=(((i>>1)*12-off)%48+48)%48-14);slabs.forEach((s,i)=>s.position.x=(((i>>1)*3-off)%54+54)%54-14);trees.forEach((t,i)=>t.position.x=(((i>>1)*8-off)%56+56)%56-14);clouds.forEach(c=>{c.position.x-=.6*dt;if(c.position.x<-45)c.position.x=45})}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;step(dt);R.render(sc,cam);requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
