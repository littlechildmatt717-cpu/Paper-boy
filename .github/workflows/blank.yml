name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set minimum Android version to 24
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/' android/variables.gradle
          grep minSdkVersion android/variables.gradle

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set app version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build Android release bundle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Sign App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'paperboy' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Error: GitHub secret $v is missing. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cp android/app/build/outputs/bundle/release/app-release.aab app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app-release.aab "$KEY_ALIAS"
          jarsigner -verify app-release.aab | tail -2

      - name: Upload App Bundle (aab)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app-release.aab

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
